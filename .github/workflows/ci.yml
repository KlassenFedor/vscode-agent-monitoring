name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is not optional. The file bus lives or dies on rename semantics,
        # file locking and path handling, and those differ there — see TESTS.md §7.
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      # Before the tests: several of them exercise the built entry points the agents
      # actually run, and building here keeps that out of the measured budgets.
      - run: npm run build

      - run: npm run typecheck

      # Style is checked once, on Linux: the same files produce the same result
      # everywhere, and paying for it three times buys nothing.
      - if: runner.os == 'Linux'
        run: npm run lint

      - if: runner.os == 'Linux'
        run: npm run format:check

      - run: npm test

  coverage:
    name: coverage (protocol)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build
      # Thresholds are enforced inside vitest.config.ts and apply to the protocol
      # package only; elsewhere the test registry is the measure, not the percentage.
      - run: npx vitest run --coverage
